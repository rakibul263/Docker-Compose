services:
  backend:
    build:
      context: ./car-management-api
      dockerfile: Dockerfile

    container_name: car-management-api

    ports:
      - "5000:5000"

    volumes:
      - car_data:/app/data

    restart: unless-stopped

  frontend:
    build:
      context: ./car-management-frontend
      dockerfile: Dockerfile

    container_name: car-management-frontend

    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped

volumes:
  car_data:
    name: car_data
